{% set name = "calc" %}
{% set version = "3.7.5" %}

package:
  name: "{{ name }}"
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/{{ name }}/archive/refs/tags/R{{ version | replace('.', '-') }}.tar.gz
    sha256: 5cf1a7b3d444e763eb96ca5b9cdbcb9c29f5a6f9ac2b8d9cdb17a007d3fa8347
  - path: ../src

build:
  number: 7
  run_exports:
    - {{ pin_subpackage('calc', max_pin='x.x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
    - perl
  host:
    - epics-base
    - require
    - sscan
    - sequencer

test:
  requires:
    - run-iocsh
    - pytest
    - p4p
    - numpy
  source_files:
    - test/
  commands:
    - run-iocsh -r calc
    - pytest -v test/

about:
  home: https://github.com/epics-modules/calc
  license: EPICS Open License
  summary: "APS BCDA synApps module: calc"
