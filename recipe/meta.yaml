{% set version = "3.7.4" %}

package:
  name: calc
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/calc/archive/refs/tags/R3-7-4.tar.gz
    sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
  - path: ../src

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('calc', max_pin='x.x.x.x') }}

requirements:
  build:
    - make
    - perl
    - tclx
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - epics-base
    - require
    - sscan
    - sequencer

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r calc

about:
  home: https://github.com/epics-modules/calc
  license: EPICS Open License
  summary: "APS BCDA synApps module: calc"
