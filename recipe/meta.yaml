{% set version = "3.7.5" %}

package:
  name: calc
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/calc/archive/refs/tags/R3-7-5.tar.gz
    sha256: 5cf1a7b3d444e763eb96ca5b9cdbcb9c29f5a6f9ac2b8d9cdb17a007d3fa8347
  - path: ../src

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('calc', max_pin='x.x.x.x') }}


requirements:
  build:
    - make
    - perl
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - epics-base 7.0.8
    - require 5.1.0
    - sscan 2.11.5
    - sequencer 2.2.9

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r calc

about:
  home: https://github.com/epics-modules/calc
  license: EPICS Open License
  summary: "APS BCDA synApps module: calc"
