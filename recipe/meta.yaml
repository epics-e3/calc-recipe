{% set version = "3.7.4" %}

package:
  name: calc
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/calc/archive/refs/tags/R3-7-4.tar.gz
    sha256: 535b0bc7f9ea1e4aea71b6b1837ac89b16c893ca4df50504e0fccacf2e69567f
  - path: ../src

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('calc', max_pin='x.x.x.x') }}
  skip: True  # [ppc64]

requirements:
  build:
    - make
    - perl
    - tclx
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - epics-base
    - require
    - sscan
    - sequencer

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r calc

about:
  home: https://github.com/epics-modules/calc
  license: EPICS Open License
  summary: "APS BCDA synApps module: calc"
